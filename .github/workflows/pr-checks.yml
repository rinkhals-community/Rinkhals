name: PR checks

# Nothing ran on pull requests before this: build-swu and develop-test-build are
# workflow_dispatch, auto-release is push-on-tag, gh-pages-deploy is push-to-master.
# So dependency bumps that break the frontend build or the Python components were
# only discovered at release time, when the Docker image build failed.
#
# Build the portal and test the Python components, plus check the embedded Go
# backend when its sources or portal assets change. A full SWU build still
# needs the firmware toolchain and is kept out of the PR gate.

on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-portal:
    name: Web portal builds
    runs-on: ubuntu-latest
    steps:
      # Full history: the change detection below needs a common ancestor with the
      # base branch, which a shallow clone does not have.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect web-portal changes
        id: changed
        run: |
          # Fail SAFE, not open: only skip the build when we can positively prove
          # web-portal/ is untouched. The first version of this compared against a
          # depth-1 fetch of the base, so there was no merge base, the diff came
          # back empty, and the build was silently skipped on PRs that did change
          # web-portal - a check that quietly does nothing is worse than no check.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Could not resolve base commit, building anyway" >&2
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- web-portal/ || true)
          if [ -n "$CHANGED" ]; then
            echo "web-portal changed:"; echo "$CHANGED"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no web-portal changes, skipping build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Keep in step with the Dockerfile's build-web-ui stage (node:22-bookworm).
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-portal/package-lock.json

      - name: npm ci
        if: steps.changed.outputs.run == 'true'
        working-directory: web-portal
        run: npm ci

      - name: npm run build
        if: steps.changed.outputs.run == 'true'
        working-directory: web-portal
        run: npm run build

  go-backend:
    name: Go backend tests and ARM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect backend or embedded UI changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] ||
             [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif ! changed_files=$(git diff --name-only "$BASE_SHA" HEAD -- \
              files/4-apps/home/rinkhals/apps/65-rinkhals-web/ \
              web-portal/ .github/workflows/pr-checks.yml); then
            echo "Could not determine changed files, running backend checks anyway" >&2
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$changed_files" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend or embedded UI changes, skipping backend checks"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-portal/package-lock.json

      - name: Build embedded frontend
        if: steps.changed.outputs.run == 'true'
        working-directory: web-portal
        run: |
          npm ci
          npm run build
          mkdir -p ../files/4-apps/home/rinkhals/apps/65-rinkhals-web/ui
          cp -a build/. ../files/4-apps/home/rinkhals/apps/65-rinkhals-web/ui/

      - uses: actions/setup-go@v7
        if: steps.changed.outputs.run == 'true'
        with:
          go-version-file: files/4-apps/home/rinkhals/apps/65-rinkhals-web/go.mod
          cache-dependency-path: files/4-apps/home/rinkhals/apps/65-rinkhals-web/go.sum

      - name: Test backend and check for races
        if: steps.changed.outputs.run == 'true'
        working-directory: files/4-apps/home/rinkhals/apps/65-rinkhals-web
        run: |
          go test -race ./...
          go vet ./...

      - name: Cross-compile static Linux ARMv7 backend
        if: steps.changed.outputs.run == 'true'
        working-directory: files/4-apps/home/rinkhals/apps/65-rinkhals-web
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
        run: |
          go build -trimpath -o "$RUNNER_TEMP/rinkhals-web-armv7" .
          readelf -h "$RUNNER_TEMP/rinkhals-web-armv7" | grep -E 'Machine:.*ARM'
          if readelf -l "$RUNNER_TEMP/rinkhals-web-armv7" | grep -q INTERP; then
            echo "Backend must not depend on a dynamic loader"
            exit 1
          fi

  python-tests:
    name: Python component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Run tests
        run: python -m pytest tests/ -q
