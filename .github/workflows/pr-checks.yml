name: PR checks

# Nothing ran on pull requests before this: build-swu and develop-test-build are
# workflow_dispatch, auto-release is push-on-tag, gh-pages-deploy is push-to-master.
# So dependency bumps that break the frontend build or the Python components were
# only discovered at release time, when the Docker image build failed.
#
# These are the two cheap checks that would have caught that, and nothing more -
# no SWU build here, since that needs the ARM toolchain and takes far too long
# for a PR gate.

on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-portal:
    name: Web portal builds
    runs-on: ubuntu-latest
    steps:
      # Full history: the change detection below needs a common ancestor with the
      # base branch, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect web-portal changes
        id: changed
        run: |
          # Fail SAFE, not open: only skip the build when we can positively prove
          # web-portal/ is untouched. The first version of this compared against a
          # depth-1 fetch of the base, so there was no merge base, the diff came
          # back empty, and the build was silently skipped on PRs that did change
          # web-portal - a check that quietly does nothing is worse than no check.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Could not resolve base commit, building anyway" >&2
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- web-portal/ || true)
          if [ -n "$CHANGED" ]; then
            echo "web-portal changed:"; echo "$CHANGED"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no web-portal changes, skipping build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Keep in step with the Dockerfile's build-web-ui stage (node:22-bookworm).
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-portal/package-lock.json

      - name: npm ci
        if: steps.changed.outputs.run == 'true'
        working-directory: web-portal
        run: npm ci

      - name: npm run build
        if: steps.changed.outputs.run == 'true'
        working-directory: web-portal
        run: npm run build

  python-tests:
    name: Python component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Run tests
        run: python -m pytest tests/ -q
