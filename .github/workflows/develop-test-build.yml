name: Develop Test Build

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Change significance (informational — used in release title)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate branch
        run: |
          if [ "${{ github.ref_name }}" != "develop" ]; then
            echo "This workflow must be run from the 'develop' branch (got '${{ github.ref_name }}')"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate beta version
        id: version
        run: |
          TODAY=$(date -u +%Y%m%d)

          # Find the highest NN already used for today's tags (e.g. 20260529_02_beta → 02)
          LATEST_NN=$(git tag | grep -E "^${TODAY}_[0-9]{2}" | sed "s/^${TODAY}_//" | cut -d'_' -f1 | sort -n | tail -1)

          if [ -z "$LATEST_NN" ]; then
            NN="01"
          else
            NN=$(printf "%02d" $((10#$LATEST_NN + 1)))
          fi

          VERSION="${TODAY}_${NN}_beta"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION  (bump type: ${{ inputs.version_bump }})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          build-args: version=${{ steps.version.outputs.version }}
          outputs: type=local,dest=./build/dist
          cache-from: type=registry,ref=ghcr.io/rinkhals-community/rinkhals:buildcache

      - name: Create beta release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "Beta build ${{ steps.version.outputs.version }} (${{ inputs.version_bump }} change)"
          git push origin "${{ steps.version.outputs.version }}"

          gh release create "${{ steps.version.outputs.version }}" \
            --repo="$GITHUB_REPOSITORY" \
            --title="Beta ${{ steps.version.outputs.version }} (${{ inputs.version_bump }})" \
            --notes="Beta build from the \`develop\` branch — **for testing only, not for production use.**" \
            --prerelease \
            build/dist/*.swu \
            build/dist/*.zip
